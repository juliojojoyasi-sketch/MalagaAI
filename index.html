<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MalagAI v3</title><style>body{font-family:system-ui;margin:0;background:#10131a;color:#eee}header{padding:18px;background:#171c27;position:sticky;top:0}button,select{padding:10px;margin:4px;border-radius:10px;border:0}main{padding:14px}.card{background:#191f2b;padding:14px;margin:10px 0;border-radius:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.muted{color:#aab2c0}input{padding:12px;width:90%;border-radius:10px;border:0}
header{border-bottom:1px solid rgba(125,235,255,.18);box-shadow:0 8px 40px rgba(65,90,255,.12)}
.brand{display:flex;align-items:center;gap:14px}.brand img{width:64px;height:64px;filter:drop-shadow(0 0 16px rgba(104,225,255,.45))}
h1{letter-spacing:.08em;margin:0}.card{border:1px solid rgba(130,220,255,.10);box-shadow:0 8px 30px rgba(0,0,0,.18)}
button{background:#18283a;color:#e9fbff;border:1px solid rgba(110,225,255,.22);cursor:pointer}button:hover{border-color:#74e7ff;transform:translateY(-1px)}
input{background:#151e2c;color:#fff;border:1px solid rgba(120,225,255,.2)}
pre{background:#090e17;padding:12px;border-radius:10px;overflow:auto;border:1px solid rgba(120,225,255,.12)}
</style></head>
<body><header><div class="brand"><img src="assets/compass-crystal.svg" alt="Icône MalagAI"><div><h1>MalagAI</h1><div class=muted>Neural Learning System</div></div></div><div class=muted>🇫🇷 Tout en français • Learning • Codage • Music • Languages • Create</div></header><main>
<input id=search placeholder="Rechercher un cours, chapitre ou mot-clé..." oninput="render()"><div id=app></div>
</main><script>
let db, data, query="";
fetch("data/database.json").then(r=>r.json()).then(x=>{db=x;render()});
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function render(){query=(document.getElementById('search')?.value||"").toLowerCase(); if(!db)return;
let out='<div class=grid><div class=card><h2>📚 Première S</h2><p>'+db.school.subjects.length+' matières • '+db.school.subjects.reduce((a,s)=>a+s.chapters.length,0)+' chapitres</p></div><div class=card><h2>🎵 Musique</h2><p>3 instruments • 5 niveaux</p></div><div class=card><h2>🌍 Langues</h2><p>'+Object.keys(db.languages).length+' langues • 5 niveaux</p></div></div>';
out+='<div class=card><h2>🧠 Révision intelligente</h2><p>Flashcards • quiz adaptatifs • répétition espacée • examens blancs • XP et maîtrise des chapitres.</p></div>';out+='<h2>📚 Cours</h2>'; db.school.subjects.forEach(s=>{let cs=s.chapters.filter(c=>(s.subject+" "+c.title+" "+c.summary).toLowerCase().includes(query)); if(cs.length) out+='<div class=card><h3>'+esc(s.subject)+'</h3>'+cs.map(c=>'<details><summary><b>'+esc(c.title)+'</b></summary><p>'+esc(c.summary)+'</p><b>À retenir</b><ul>'+c.key_points.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><b>Exercices</b>'+c.exercises.map((e,i)=>'<p>'+ (i+1)+'. '+esc(e.question)+'<br><span class=muted>Correction: '+esc(e.answer)+'</span></p>').join('')+'</details>').join('')+'</div>'});
out+='<h2>💻 Learning Codage</h2>';Object.entries(db.coding).forEach(([lang,info])=>out+='<div class=card><details><summary><b>'+lang+'</b> — 5 niveaux</summary><p>'+esc(info.description)+'</p>'+info.levels.map(v=>'<details><summary>Niveau '+v.level+' — '+v.name+' — '+v.modules.length+' modules</summary>'+v.modules.map(m=>'<div class=card><h4>'+esc(m.title)+'</h4><p>'+esc(m.summary)+'</p><b>Concepts</b><ul>'+m.concepts.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><pre>'+esc(m.example)+'</pre><b>Exercices</b>'+m.exercises.map(e=>'<p>⭐'+e.difficulty+' — '+esc(e.question)+'<br><span class=muted>'+esc(e.correction)+'</span></p>').join('')+'<b>Erreurs fréquentes</b><ul>'+m.mistakes.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>').join('')+'<p><b>'+esc(v.project)+'</b></p></details>').join('')+'</details></div>');out+='<h2>🎵 Musique</h2>';Object.entries(db.music).forEach(([i,ls])=>out+='<div class=card><h3>'+i+'</h3>'+ls.map(l=>'<details><summary>Niveau '+l.level+'</summary>'+l.modules.map(m=>'<p><b>'+m.title+'</b> — '+m.lesson+'<br>Exercice: '+m.exercise+'</p>').join('')+'</details>').join('')+'</div>');
out+='<h2>🌍 Langues</h2>';Object.entries(db.languages).forEach(([l,ls])=>out+='<div class=card><details><summary>'+l+' — 5 niveaux</summary>'+ls.levels.map(v=>'<h4>Niveau '+v.level+' — '+v.name+'</h4>'+v.lessons.slice(0,4).map(x=>'<p><b>'+x.topic+'</b>: '+x.lesson+'<br>'+x.exercise+'</p>').join('')).join('')+'</details></div>');
document.getElementById('app').innerHTML=out}
</script></body></html>
